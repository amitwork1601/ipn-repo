site_name: Legacy Documentation Explorer
site_description: Auto-generated documentation for multi-repo legacy systems
site_url: ""
site_dir: site
# Force fresh build
validation:
  omitted_files: ignore

theme:
  name: material
  logo: assets/logo.jpg
  favicon: assets/favicon.jpg
use_directory_urls: false
  palette:
    primary: green
    accent: green
  features:
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.escapeall


nav:
  - Home: index.md
  - Overview: SUMMARY.md
  - Explorer: explorer.md

extra:
  generator: "Codebase Documentation Generator"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js




